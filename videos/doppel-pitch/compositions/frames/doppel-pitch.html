      </section>

      <div data-hf-id="hf-p-progress" id="p-progress"><i data-hf-id="hf-p-progressfill"></i></div>
    </div>

    <script>
      (function () {
        "use strict";
        function el(name) { return document.getElementById("p-" + name); }
        var tl = gsap.timeline({ paused: true });

        // Scene boundaries come from the measured per-line narration durations
        // (assets/vo/timeline.json). Every boundary lands inside an inter-line silence.
        var S1 = 0, S2 = 3.84, S3 = 16.08, S4 = 19.12, S5 = 38.6, S6 = 49.51,
            S7 = 54.14, S8 = 68.92, S9 = 72.23, S10 = 79.72, S11 = 91.01,
            S12 = 103.11, END = 116;

        // One scene visible at a time; autoAlpha keeps hidden scenes out of layout and paint.
        function scene(name, start, end) {
          var node = el(name);
          tl.set(node, { autoAlpha: 1 }, start);
          if (end < END) tl.to(node, { autoAlpha: 0, duration: 0.45, ease: "power2.inOut" }, end - 0.45);
        }
        function enter(node, at, fromY, dur) {
          tl.fromTo(node, { opacity: 0, y: (fromY || 2) + "cqh" },
            { opacity: 1, y: "0cqh", duration: dur || 0.7, ease: "power3.out" }, at);
        }
        function plateIn(node, at, hold) {
          tl.fromTo(node, { opacity: 0, y: "2.2cqh", scale: 0.985 },
            { opacity: 1, y: "0cqh", scale: 1, duration: 0.85, ease: "power3.out" }, at);
          if (hold > 0) tl.to(node, { scale: 1.04, duration: hold, ease: "none" }, at + 0.9);
        }

        tl.fromTo(el("brand"), { opacity: 0, y: "1cqh" }, { opacity: 1, y: "0cqh", duration: 0.5, ease: "power2.out" }, 0.15);

        // 1 — hook
        scene("hook", S1, S2);
        tl.fromTo(el("hook-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power2.out" }, 0.3);
        enter(el("hook-title"), 0.45, 2.2, 0.75);
        enter(el("hook-sub"), 2.3, 1.2, 0.65);

        // 2 — mechanic
        scene("mechanic", S2, S3);
        tl.fromTo(el("mechanic").querySelector(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, S2 + 0.1);
        enter(el("row-a"), S2 + 0.8, 1.6, 0.65);
        enter(el("row-b"), S2 + 5.6, 1.6, 0.65);
        enter(el("tags"), S2 + 8.6, 1.4, 0.7);
        // Light the differing middle only once the narration has named the dust transfer.
        tl.to(el("mid-b"), { color: "#FF7A7A", duration: 0.55, ease: "power2.out" }, S2 + 7.2);

        // 3 — it only has to wait
        scene("wait", S3, S4);
        enter(el("wait-title"), S3 + 0.15, 2.4, 0.8);
        tl.fromTo(el("caret"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, S3 + 1.5);
        tl.to(el("caret"), { opacity: 0.25, duration: 0.6, repeat: 3, yoyo: true, ease: "power1.inOut" }, S3 + 1.9);

        // 4 — why now
        scene("whynow", S4, S5);
        tl.fromTo(el("whynow").querySelector(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, S4 + 0.1);
        enter(el("item1"), S4 + 0.9, 1.8, 0.7);
        enter(el("item2"), S4 + 6.4, 1.8, 0.7);
        enter(el("item3"), S4 + 12.0, 1.8, 0.7);
        enter(el("sample"), S4 + 16.4, 1.4, 0.7);
        // The single wrong glyph lands on the narration's last beat.
        tl.fromTo(el("sample").querySelector("u"), { color: "#FFC46B", opacity: 0.25 },
          { color: "#FFC46B", opacity: 1, duration: 0.6, ease: "power2.out" }, S4 + 17.4);
        tl.to(el("brand"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, S5 - 0.5);

        // 5 — the turn
        scene("insight", S5, S6);
        enter(el("lead"), S5 + 0.1, 1.2, 0.6);
        enter(el("insight-title"), S5 + 1.4, 2.4, 0.85);
        enter(el("concl"), S5 + 6.6, 1.8, 0.75);

        // 6 — principle
        scene("principle", S6, S7);
        enter(el("frame"), S6 + 0.15, 2, 0.75);
        enter(el("principle-title"), S6 + 0.45, 2.4, 0.85);
        enter(el("principle-note"), S6 + 2.6, 1.2, 0.65);
        tl.to(el("brand"), { opacity: 1, duration: 0.4, ease: "power2.inOut" }, S6 + 0.2);

        // 7 — what Doppel does
        scene("product", S7, S8);
        enter(el("product-title"), S7 + 0.1, 1.8, 0.7);
        enter(el("product").querySelectorAll(".pt")[0], S7 + 0.7, 1.4, 0.6);
        enter(el("product").querySelectorAll(".pt")[1], S7 + 2.6, 1.4, 0.6);
        enter(el("product").querySelectorAll(".pt")[2], S7 + 4.5, 1.4, 0.6);
        plateIn(el("product-plate"), S7 + 0.8, S8 - S7 - 2.2);

        // 8 — blocked
        scene("blocked", S8, S9);
        enter(el("blocked-title"), S8 + 0.1, 2.2, 0.75);
        enter(el("blocked-plate"), S8 + 1.0, 1.4, 0.6);
        enter(el("blocked-plate2"), S8 + 1.35, 1.4, 0.6);
        enter(el("blocked-state"), S8 + 1.9, 1.2, 0.6);

        // 9 — safety posture
        scene("safety", S9, S10);
        enter(el("safety-title"), S9 + 0.1, 1.8, 0.7);
        enter(el("safety-chips"), S9 + 0.8, 1.4, 0.65);
        plateIn(el("safety-plate"), S9 + 1.5, S10 - S9 - 3.0);
        enter(el("safety-foot"), S9 + 2.6, 1, 0.6);

        // 10 — what it ships as
        scene("ships", S10, S11);
        tl.fromTo(el("ships").querySelector(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, S10 + 0.1);
        enter(el("cards").children[0], S10 + 0.7, 1.8, 0.65);
        enter(el("cards").children[1], S10 + 2.6, 1.8, 0.65);
        enter(el("cards").children[2], S10 + 4.5, 1.8, 0.65);
        plateIn(el("ships-plate"), S10 + 6.4, S11 - S10 - 7.4);

        // 11 — why me
        scene("whyme", S11, S12);
        enter(el("whyme-title"), S11 + 0.1, 1.8, 0.7);
        enter(el("whyme").querySelectorAll(".pt")[0], S11 + 0.8, 1.4, 0.6);
        enter(el("whyme").querySelectorAll(".pt")[1], S11 + 3.4, 1.4, 0.6);
        enter(el("whyme").querySelectorAll(".pt")[2], S11 + 6.0, 1.4, 0.6);
        plateIn(el("whyme-plate"), S11 + 0.8, S12 - S11 - 2.2);
        tl.to(el("brand"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, S11 + 0.3);

        // 12 — close
        scene("close", S12, END);
        tl.fromTo(el("logo"), { opacity: 0, y: "1.4cqh", scale: 0.97 },
          { opacity: 1, y: "0cqh", scale: 1, duration: 0.7, ease: "power3.out" }, S12 + 0.1);
        enter(el("stats"), S12 + 0.7, 1.4, 0.65);
        enter(el("close-title"), S12 + 3.4, 2.2, 0.8);
        enter(el("url"), S12 + 6.6, 1, 0.65);

        tl.fromTo(el("progress"), { scaleX: 0 }, { scaleX: 1, duration: END, ease: "none" }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["doppel-pitch"] = tl;
      })();
    </script>
  </div>
</template>
