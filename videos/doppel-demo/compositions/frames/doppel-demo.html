        // One scene visible at a time; autoAlpha keeps hidden scenes out of layout and paint.
        function scene(name, start, end) {
          var node = el(name);

          if (end < END) tl.to(node, { autoAlpha: 0, duration: 0.45, ease: "power2.inOut" }, end - 0.45);
        }
        function enter(node, at, fromY, dur) {
          tl.fromTo(node, { opacity: 0, y: (fromY || 2) + "cqh" },
            { opacity: 1, y: "0cqh", duration: dur || 0.7, ease: "power3.out" }, at);
        }

        // 1 — hook
        scene("hook", S1, S2);
        tl.fromTo(el("hook-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power2.out" }, 0.3);

        enter(el("addr-a"), 1.9, 1.6, 0.65);
        enter(el("addr-b"), 4.5, 1.6, 0.65);
        // Reveal the differing middle only once the narration names it.
        tl.to(el("b2"), { color: "#FF7A7A", duration: 0.5, ease: "power2.out" }, 6.5);

        // 2 — attack steps
        scene("attack", S2, S3);
        enter(el("attack-title"), S2 + 0.15, 1.8, 0.7);
        enter(el("step1"), S2 + 1.0, 2, 0.7);

        enter(el("step3"), S2 + 8.2, 2, 0.7);
        tl.to(el("brand"), { opacity: 0, duration: 0.4, ease: "power2.inOut" }, S3 - 0.5);

        // 3 — promise card
        scene("promise", S3, S4);
        tl.fromTo(el("promise-logo"), { opacity: 0, y: "1.5cqh", scale: 0.97 },
          { opacity: 1, y: "0cqh", scale: 1, duration: 0.7, ease: "power3.out" }, S3 + 0.1);
        enter(el("promise-title"), S3 + 0.35, 2.2, 0.8);
        tl.to(el("brand"), { opacity: 1, duration: 0.4, ease: "power2.inOut" }, S4 - 0.2);

        // 4 — check an address
        scene("check", S4, S5);
        enter(el("check-title"), S4 + 0.1, 1.8, 0.7);
        enter(el("check-sub"), S4 + 0.55, 1.4, 0.65);
        tl.fromTo(el("home"), { opacity: 0, y: "2.4cqh", scale: 0.985 },

        tl.to(el("home"), { scale: 1.045, duration: S5 - S4 - 1.6, ease: "none" }, S4 + 1.3);

        // 5 — saved recipients
        scene("saved", S5, S6);
        enter(el("saved-title"), S5 + 0.1, 1.8, 0.7);
        enter(el("saved-sub"), S5 + 0.5, 1.4, 0.65);
        tl.fromTo(el("recipients"), { opacity: 0, y: "2.4cqh", scale: 0.985 },
          { opacity: 1, y: "0cqh", scale: 1, duration: 0.85, ease: "power3.out" }, S5 + 0.85);
        tl.to(el("recipients"), { scale: 1.04, duration: S6 - S5 - 1.6, ease: "none" }, S5 + 1.25);

        // 6 — mismatch evidence
        scene("mismatch", S6, S7);
        enter(el("twin-title"), S6 + 0.1, 1.8, 0.7);
        tl.fromTo(el("different"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, S6 + 1.2);
        enter(el("twin"), S6 + 1.6, 2, 0.8);
        enter(el("result"), S6 + 4.4, 1.6, 0.7);
        enter(el("chip1"), S6 + 5.8, 1.2, 0.5);
        enter(el("chip2"), S6 + 6.2, 1.2, 0.5);
        enter(el("chip3"), S6 + 6.6, 1.2, 0.5);

        // 7 — blocked
        scene("blocked", S7, S8);
        enter(el("block-title"), S7 + 0.1, 2, 0.75);
        enter(el("button"), S7 + 1.1, 1.4, 0.65);
        enter(el("block-note"), S7 + 1.9, 1.2, 0.6);

        // 8 — match restored
        scene("match", S8, S9);
        enter(el("match-title"), S8 + 0.1, 1.8, 0.7);
        tl.fromTo(el("ok"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, S8 + 1.1);
        enter(el("twin-match"), S8 + 1.5, 2, 0.8);
        enter(el("devnet"), S8 + 4.0, 1.2, 0.65);

        // 9 — monitor
        scene("monitor-sec", S9, S10);
        enter(el("mon-title"), S9 + 0.1, 1.8, 0.7);
